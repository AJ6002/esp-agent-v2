    ### Granular Input Specifications

    | # | Channel Name | State Variable | Step | Min / Max | Engineering Unit | Visual Accent |
    |---|---|---|:---:|:---:|:---:|:---:|
    | **1** | Drive Frequency | `freq` | $0.5$ | $30 - 65$ | $\text{Hz}$ | Emerald |
    | **2** | Intake Pressure (PIP) | `pip` | $10$ | $0 - 1500$ | $\text{psi}$ | Cyan |
